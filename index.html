<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenBeast</title>
  <meta name="description" content="OpenBeast：把 AI 对话、文档、待办和你自己的小应用放进同一个 Mac 应用。">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  <style>
    :root { --bg: #fafaf9; --fg: #1c1917; --muted: #57534e; --line: #e7e5e4; --chip: #f5f5f4; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0c0a09; --fg: #fafaf9; --muted: #a8a29e; --line: #292524; --chip: #1c1917; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px 16px; }
    img { width: 112px; height: 112px; border-radius: 24px; }
    h1 { margin: 24px 0 8px; font-size: 40px; font-weight: 600; letter-spacing: -0.02em; }
    p { margin: 0; max-width: 32rem; color: var(--muted); }
    .soon { margin-top: 32px; padding: 10px 18px; border: 1px solid var(--line); border-radius: 999px; background: var(--chip); font-size: 14px; }
    .download { margin-top: 32px; display: inline-block; padding: 12px 24px; border-radius: 999px; background: var(--fg); color: var(--bg); font-size: 15px; font-weight: 600; text-decoration: none; }
    .meta { margin-top: 10px; font-size: 13px; color: var(--muted); }
    [hidden] { display: none !important; }
    .web { margin-top: 20px; font-size: 14px; color: var(--muted); }
    a { color: inherit; }
    footer { padding: 24px 16px; text-align: center; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <main>
    <img src="/logo.png" alt="OpenBeast">
    <h1>OpenBeast</h1>
    <p>把 AI 对话、文档、待办和你自己的小应用放进同一个 Mac 应用。</p>
    <a class="download" id="download" href="/download">下载 macOS 版</a>
    <div class="meta" id="meta">Apple Silicon · 装好后会自动更新</div>
    <div class="soon" id="soon" hidden>macOS 版即将开放下载</div>
    <div class="web">已有网页版账号？<a href="https://app.openbeast.app">登录网页版 →</a></div>
  </main>
  <footer>© OpenBeast</footer>
  <script>
    // 发布仓库还没有任何一版时 /download 无处可去：GitHub 明确答「没有」才换成「即将开放」。
    // 查不到（限流、网络）就照常显示下载按钮。
    fetch("https://api.github.com/repos/oktiger/openbeast-releases/releases/latest")
      .then(function (response) {
        if (response.status === 404) {
          document.getElementById("download").hidden = true;
          document.getElementById("meta").hidden = true;
          document.getElementById("soon").hidden = false;
          return null;
        }
        return response.ok ? response.json() : null;
      })
      .then(function (release) {
        if (release && release.tag_name) {
          document.getElementById("meta").textContent = "最新版本 " + release.tag_name.replace(/^v/, "") + " · Apple Silicon · 装好后会自动更新";
        }
      })
      .catch(function () {});
  </script>
</body>
</html>

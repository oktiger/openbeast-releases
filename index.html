<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenBeast</title>
  <meta name="description" content="OpenBeast：把 AI 对话、文档、待办和你自己的小应用放进同一个 Mac 应用。">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  <style>
    :root { --bg: #fafaf9; --fg: #1c1917; --muted: #57534e; --line: #e7e5e4; --chip: #f5f5f4; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0c0a09; --fg: #fafaf9; --muted: #a8a29e; --line: #292524; --chip: #1c1917; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px 16px; }
    img { width: 112px; height: 112px; border-radius: 24px; }
    h1 { margin: 24px 0 8px; font-size: 40px; font-weight: 600; letter-spacing: -0.02em; }
    p { margin: 0; max-width: 32rem; color: var(--muted); }
    .soon { margin-top: 32px; padding: 10px 18px; border: 1px solid var(--line); border-radius: 999px; background: var(--chip); font-size: 14px; }
    .web { margin-top: 20px; font-size: 14px; color: var(--muted); }
    a { color: inherit; }
    footer { padding: 24px 16px; text-align: center; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <main>
    <img src="/logo.png" alt="OpenBeast">
    <h1>OpenBeast</h1>
    <p>把 AI 对话、文档、待办和你自己的小应用放进同一个 Mac 应用。</p>
    <div class="soon">macOS 版即将开放下载</div>
    <div class="web">已有网页版账号？<a href="https://app.openbeast.app">登录网页版 →</a></div>
  </main>
  <footer>© OpenBeast</footer>
</body>
</html>

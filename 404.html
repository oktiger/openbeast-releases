<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Page not found · OpenBeast</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d0c0a" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/site.css" />
  <script>document.documentElement.classList.add("js");</script>
  <script src="/site.js" defer></script>
</head>
<body>
  <header class="nav" id="nav">
    <div class="container nav-inner">
      <a class="brand" href="/" aria-label="OpenBeast home"><img src="/icon.png" alt="" />OpenBeast</a>
    </div>
  </header>

  <main class="notfound">
    <div class="container">
      <span class="code rise" style="--i:0" aria-hidden="true">404</span>
      <h1 class="rise" style="--i:1">Page not found<br /><span lang="zh-CN">找不到这一页</span></h1>
      <p class="rise" style="--i:2">The address may be mistyped, or the page has moved.<br /><span lang="zh-CN">地址可能输错了，或者这一页已经搬走。</span></p>
      <div class="buttons rise" style="--i:3">
        <a class="btn btn-primary" href="/">Back to home</a>
        <a class="btn btn-ghost" href="/zh" lang="zh-CN">回到中文首页</a>
      </div>
    </div>
  </main>
</body>
</html>
